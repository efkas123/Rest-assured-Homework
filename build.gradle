plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "org.slf4j:slf4j-simple:2.0.13",
            "org.junit.jupiter:junit-jupiter:5.10.0",
            "io.rest-assured:rest-assured:5.5.6",
            "org.hamcrest:hamcrest:3.0"
    )
}

test {
    useJUnitPlatform()
}