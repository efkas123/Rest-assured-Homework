plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.11.2'
}

def allureVersion = "2.28.0"

repositories {
    mavenCentral()
}
allure{
    report{
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.9.4",
            "org.slf4j:slf4j-simple:2.0.13",
            "org.junit.jupiter:junit-jupiter:5.10.0",
            'io.qameta.allure:allure-junit5:2.24.0',
            'io.qameta.allure:allure-selenide:2.24.0'

    )
}

tasks.withType(Test) {
    systemProperties(System.getProperties()) //Для себя - позволяет передавать параметры, заданные через -D в JVM
    useJUnitPlatform()
    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

task demoqa_test(type:Test) {
    useJUnitPlatform{
        includeTags("demoqa")
    }
}
